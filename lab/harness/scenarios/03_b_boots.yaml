name: 03_b_boots
description: Deploy B, select-boot B, reboot, B boots healthy
backends:
- sim
- qemu
fixture:
  slot_a_image: v1
  network: up
steps:
- boot:
    expect_state: HEALTHY
- deploy:
    slot: B
    image: v2
    version: v2
- select_boot: B
- reboot: {}
expected:
  serial_contains:
  - BOOT slot=B
  - AGENT_BOOT state=HEALTHY
  state: HEALTHY
  active_slot: B
