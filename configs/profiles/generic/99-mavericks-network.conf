# Mavericks Linux — NetworkManager connectivity tuning (generic)
# Deep Runtime Track D2 (2026-09-28). Evidence: NetworkManager 1.58.1,
# wpa_supplicant 2.12, iwd 3.12 sources + Arch package file lists.
# This file shadows /usr/lib/NetworkManager/conf.d/20-connectivity.conf
# (etc > usr/lib precedence) and disables periodic connectivity checks.
# MacBook-specific Wi-Fi backend pin is in 99-mavericks-wifi-backend.conf
# (installed only on MacBook10,1 hardware path).

[connectivity]
# Disable NM's periodic HTTP connectivity check.
# Evidence: Arch ships /usr/lib/NetworkManager/conf.d/20-connectivity.conf with
#   uri=http://ping.archlinux.org/nm-check.txt
# NM defaults: connectivity.enabled=true, interval=300s, timeout=20s
# (nm-config.h: NM_CONFIG_DEFAULT_CONNECTIVITY_INTERVAL 300).
# So stock Arch NM polls an HTTP endpoint every 5 min whenever a connection
# exists. Our offline discipline + fanless battery budget: no 5-min HTTP poll.
# Captive-portal detection is not a Mavericks-Linux requirement.
# Re-enable by deleting this file if it is ever needed.
enabled=false