# PROFILE: bootstrap — minimal-safe first boot
# Use for VERY FIRST hardware boot. No assumptions beyond bootability.
# Kernel: linux-zen (fallback: linux-lts entry exists but not default)
# CMDLINE composed from: base (quiet loglevel=3) + fragments/
# MacBook-specific fragments (installed on MacBook10,1 path only):
#   fragments/99-mavericks-s3x.conf      → pcie_port_pm=off
#   fragments/99-mavericks-display.conf  → i915.enable_psr=0
# On generic hardware, fragments are absent → kernel defaults apply.
CMDLINE="quiet loglevel=3 pcie_port_pm=off i915.enable_psr=0"
# TLP: minimal (see configs/profiles/tlp-baseline.conf)
# Sysctl: none (kernel defaults)
# zram: ram/2 zstd (structural, always on)
# Services: TLP + zram + NetworkManager; NO thermald/ananicy
# Desktop: Xfce + Mavericks theme (visual layer separable)
# Status: IMPLEMENTED + UNVALIDATED