# MavLinOS — Apple S3X NVMe resume workaround (MacBook10,1)
# Phase 0.3 baseline: pcie_port_pm=off is a PROVISIONAL workaround
# for Apple S3X controller resume issues (Sep 2026 LKML thread).
# This fragment is installed ONLY on MacBook10,1 hardware path.
# On generic hardware, this file is absent → kernel default (pcie_port_pm=on).
# Graceful-missing semantics: kernel cmdline fragments concatenated;
# absent fragment = no override, kernel default applies.
#
# Validation: E2 experiment tests removal (configs/profiles/experiments/E2-pcie-pm-on.cmdline).
# If resume works without it on target hardware, REMOVE this fragment.

pcie_port_pm=off