# Mavericks Linux — MacBook10,1 Wi-Fi backend pin (BCM43602 / brcmfmac)
# Deep Runtime Track D2 (2026-09-28). Evidence: NetworkManager 1.58.1,
# wpa_supplicant 2.12, iwd 3.12 sources + Arch package file lists.
# This fragment is installed ONLY on MacBook10,1 hardware path.
# On generic hardware, this file is absent → NM uses compile-time default (wpa_supplicant).
# Graceful-missing semantics: NetworkManager reads all *.conf in conf.d;
# absent fragment = no opinion, default backend applies.

[device]
# Explicit Wi-Fi backend. NM compile-time default is wpa_supplicant
# (meson.build:430-436: config_wifi_backend_default='default' -> 'wpa_supplicant').
# Pinned here so a future NM default flip cannot silently change the backend.
# wpa_supplicant chosen over iwd for BCM43602 FullMAC:
#   - full feature support (P2P / AP / hidden / ad-hoc); iwd backend has no P2P,
#     802.1X needs iwd provisioning files, hidden SSIDs infra-only (nm-device-iwd.c)
#   - NM-controlled roaming with supplicant settle wait (nm-device-wifi.c:2611)
#   - mature NM integration (iwd backend is still capability-limited)
# Powersave is NOT a differentiator: NM 1.58.1 sets 802.11 PS via
# NL80211_CMD_SET_POWER_SAVE directly for BOTH backends
# (nm-device-wifi.c:3412, nm-device-iwd.c:2274 -> nm-wifi-utils-nl80211.c:260).
wifi.backend=wpa_supplicant