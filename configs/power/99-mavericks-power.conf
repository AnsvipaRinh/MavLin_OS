# Mavericks Linux — MacBook10,1 TLP power tuning (fanless Core M)
# Phase 0.3 baseline: conservative powersave settings for MacBook10,1.
# This fragment is installed ONLY on MacBook10,1 hardware path.
# On generic hardware, this file is absent → TLP/kernel defaults apply.
# Graceful-missing semantics: TLP reads all *.conf in /etc/tlp.d/;
# absent fragment = no MacBook overrides, generic defaults apply.
#
# Rationale (per frozen power baseline, AGENTS.md §7):
# - powersave governor: minimizes frequency on fanless Core M, reduces thermals
# - ASPM powersave: enables deepest PCIe link states for battery
# - USB autosuspend: allows idle USB devices to sleep
# - Runtime PM auto: lets kernel manage device runtime PM
# CPU_BOOST / CPU_HWP_DYN_BOOST / CPU_ENERGY_PERF_POLICY / PLATFORM_PROFILE
# intentionally unset — HWP decides; experiments in E8/E9.

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
PCIE_ASPM_ON_AC=powersave
PCIE_ASPM_ON_BAT=powersave
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
USB_AUTOSUSPEND=1