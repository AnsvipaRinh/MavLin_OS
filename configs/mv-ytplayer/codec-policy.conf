# mv-ytplayer codec policy — easily editable policy layer
# Edit CODEC_RANK to change codec preference order. One codec per line, in priority order.
# Format: <yt-dlp vcodec prefix> <comment>
# The selector chain is built from this list at runtime.
#
# NO-CONCLUSION: Final codec choice comes from measured power/thermal on MacBook10,1,
# not from host bench. This policy is a starting point based on Gen9.5 HW availability.
# See docs/HW_BROWSER_MATRIX.md for the 4-mode measurement plan.

avc1
vp09
hev1
