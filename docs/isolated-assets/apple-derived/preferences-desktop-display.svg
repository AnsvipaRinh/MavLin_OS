<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="displayBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#282828;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E1E1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141414;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="displayScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2A3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="displayStand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8C0B8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A8A098;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#989088;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appleColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8C0B8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Display body -->
    <rect x="40" y="28" width="176" height="136" rx="6" ry="6" fill="url(#displayBody)" stroke="#383838" stroke-width="2"/>
    <!-- Screen -->
    <rect x="52" y="40" width="152" height="100" rx="3" ry="3" fill="url(#displayScreen)" stroke="#1A2A3A" stroke-width="1"/>
    <!-- Stand -->
    <path d="M118 164 L118 188 Q118 196 128 196 L128 196 Q138 196 138 188 L138 164 Z" fill="url(#displayStand)"/>
    <ellipse cx="128" cy="200" rx="24" ry="6" fill="url(#displayStand)"/>
  </g>
  
  <!-- Screen content: resolution indicator -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#80C0E0" text-anchor="middle" dominant-baseline="central" filter="url(#glow)">
    <text x="128" y="80">2304 × 1440</text>
    <text x="128" y="104" font-size="11" font-weight="normal" fill="#60A0C0">Retina Display</text>
  </g>
  
  <!-- Apple logo on back -->
  <g transform="translate(128, 100) scale(0.35)" fill="#E8E0D8" opacity="0.8">
    <path d="M0,-72 C-52,-72 -92,-32 -92,20 C-92,72 -52,112 0,112 C52,112 92,72 92,20 C92,-32 52,-72 0,-72 Z"/>
    <path d="M0,-72 C-20,-72 -40,-52 -40,-20 C-40,12 -20,32 0,32 C20,32 40,12 40,-20 C40,-52 20,-72 0,-72 Z" fill="#1A1A1A"/>
  </g>
</svg>
