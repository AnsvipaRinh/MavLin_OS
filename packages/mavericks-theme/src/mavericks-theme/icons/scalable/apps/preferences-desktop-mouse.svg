<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#F8F4E8;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8D0C8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mouseTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0D8D0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mouseBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8C0B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8A098;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mouseButton" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0E8E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0D8D0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Mouse body (generic Mighty Mouse style) -->
    <path d="M64,180 Q64,100 128,100 Q192,100 192,180 Q192,220 128,220 Q64,220 64,180 Z" 
          fill="url(#mouseBody)" stroke="#C8C0B8" stroke-width="1.5"/>
    
    <!-- Top highlight -->
    <path d="M80,120 Q128,110 176,120" stroke="url(#mouseTop)" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M90,130 Q128,124 166,130" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.3"/>
    
    <!-- Touch surface division line -->
    <path d="M128,110 L128,190" stroke="#D8D0C8" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
    
    <!-- Scroll ball (generic) -->
    <circle cx="128" cy="140" r="16" fill="url(#mouseButton)" stroke="#C8C0B8" stroke-width="1.5"/>
    <circle cx="128" cy="140" r="12" fill="#E8E0D8"/>
    <circle cx="124" cy="134" r="3" fill="#FFFFFF" opacity="0.5"/>
    
    <!-- Generic logo placeholder (neutral circle) -->
    <g transform="translate(128, 150) scale(0.25)" fill="#888078">
      <circle cx="0" cy="0" r="36" fill="#B8B0A8" stroke="#989088" stroke-width="2"/>
      <circle cx="0" cy="0" r="24" fill="#D8D0C8"/>
    </g>
    
    <!-- Bottom feet -->
    <ellipse cx="90" cy="200" rx="14" ry="4" fill="url(#mouseBottom)"/>
    <ellipse cx="166" cy="200" rx="14" ry="4" fill="url(#mouseBottom)"/>
    <ellipse cx="128" cy="212" rx="10" ry="3" fill="#989088"/>
    
    <!-- Cable -->
    <path d="M128,220 Q128,240 110,256" stroke="#C8C0B8" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>