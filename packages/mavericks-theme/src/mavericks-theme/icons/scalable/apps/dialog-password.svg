<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="keyBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D8C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D8C8B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8B8A0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E0C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8C8B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F8E8A0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8D880;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8E8A0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyTeeth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8C8A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8A888;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)" transform="translate(128, 128)">
    <!-- Key ring (bow) -->
    <circle cx="-8" cy="-40" r="22" fill="url(#keyRing)" stroke="#D8C880" stroke-width="2"/>
    <circle cx="-8" cy="-40" r="12" fill="#181818"/>
    <circle cx="-8" cy="-40" r="6" fill="#383838"/>
    
    <!-- Key shaft -->
    <rect x="-16" y="-20" width="32" height="80" rx="4" ry="4" fill="url(#keyBody)" stroke="#A89880" stroke-width="1.5"/>
    <!-- Shaft highlight -->
    <path d="M-10,-20 L-10,60" stroke="#F8E8D8" stroke-width="1" opacity="0.4"/>
    
    <!-- Key teeth -->
    <g fill="url(#keyTeeth)" stroke="#988870" stroke-width="1">
      <rect x="-16" y="48" width="32" height="8" rx="2" ry="2"/>
      <rect x="-8" y="56" width="16" height="12" rx="2" ry="2"/>
      <rect x="-16" y="68" width="32" height="8" rx="2" ry="2"/>
      <rect x="-4" y="60" width="8" height="16" rx="1" ry="1"/>
    </g>
    
    <!-- Key cuts (grooves) -->
    <g stroke="#A89880" stroke-width="1" opacity="0.3">
      <line x1="-12" y1="-12" x2="12" y2="-12"/>
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-12" y1="12" x2="12" y2="12"/>
      <line x1="-12" y1="24" x2="12" y2="24"/>
      <line x1="-12" y1="36" x2="12" y2="36"/>
    </g>
    
    <!-- Lock icon overlay -->
    <g transform="translate(40, 20)" fill="#282828" filter="url(#glow)">
      <!-- Lock body -->
      <rect x="-12" y="0" width="24" height="20" rx="3" ry="3"/>
      <!-- Shackle -->
      <path d="M-8,-8 Q-8,-16 0,-16 Q8,-16 8,-8" stroke="#282828" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- Keyhole -->
      <circle cx="0" cy="6" r="3" fill="#0D0D0D"/>
      <rect x="-2" y="9" width="4" height="6" fill="#0D0D0D"/>
    </g>
  </g>
</svg>
