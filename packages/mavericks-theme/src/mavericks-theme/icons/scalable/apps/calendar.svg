<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="calBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F0E0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8D8C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8C8B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C83838;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B03030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#982828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E8E0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Calendar body -->
    <rect x="48" y="48" width="160" height="160" rx="8" ry="8" fill="url(#calBody)" stroke="#B8A898" stroke-width="2"/>
    <!-- Header -->
    <rect x="48" y="48" width="160" height="48" rx="8" ry="8" fill="url(#calHeader)"/>
    <!-- Fix header corners -->
    <rect x="48" y="72" width="160" height="24" fill="url(#calHeader)"/>
    <!-- Month text -->
    <text x="128" y="78" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">JULY</text>
    <!-- Year -->
    <text x="128" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#FFE8E8" text-anchor="middle">2009</text>
  </g>
  
  <!-- Rings at top -->
  <g filter="url(#ringShadow)">
    <circle cx="96" cy="48" r="8" fill="#D8C8B8" stroke="#A89888" stroke-width="1.5"/>
    <circle cx="96" cy="48" r="4" fill="#F0E0D0"/>
    <circle cx="160" cy="48" r="8" fill="#D8C8B8" stroke="#A89888" stroke-width="1.5"/>
    <circle cx="160" cy="48" r="4" fill="#F0E0D0"/>
  </g>
  
  <!-- Calendar grid -->
  <g fill="none" stroke="#D0C0B0" stroke-width="0.8">
    <line x1="56" y1="112" x2="200" y2="112"/>
    <line x1="56" y1="136" x2="200" y2="136"/>
    <line x1="56" y1="160" x2="200" y2="160"/>
    <line x1="56" y1="184" x2="200" y2="184"/>
    <line x1="56" y1="208" x2="200" y2="208"/>
    <line x1="56" y1="104" x2="56" y2="208"/>
    <line x1="80" y1="104" x2="80" y2="208"/>
    <line x1="104" y1="104" x2="104" y2="208"/>
    <line x1="128" y1="104" x2="128" y2="208"/>
    <line x1="152" y1="104" x2="152" y2="208"/>
    <line x1="176" y1="104" x2="176" y2="208"/>
    <line x1="200" y1="104" x2="200" y2="208"/>
  </g>
  
  <!-- Day numbers (just a few visible) -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#403830" text-anchor="middle" dominant-baseline="central">
    <text x="68" y="124">1</text>
    <text x="92" y="124">2</text>
    <text x="116" y="124">3</text>
    <text x="140" y="124">4</text>
    <text x="164" y="124">5</text>
    <text x="188" y="124">6</text>
  </g>
  
  <!-- Today highlight -->
  <rect x="136" y="144" width="20" height="20" rx="3" ry="3" fill="#C83838" opacity="0.2"/>
  <text x="146" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#C83838" text-anchor="middle">15</text>
</svg>
