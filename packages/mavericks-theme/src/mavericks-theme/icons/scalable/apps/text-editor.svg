<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F8F4E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E8D8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E8D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0D8C8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="penBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C84038;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B03830;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C84038;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="penMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8C0B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E0D8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Paper sheet -->
    <path d="M48 48 L48 208 Q48 224 64 224 L192 224 Q208 224 208 208 L208 48 Q208 32 192 32 L64 32 Q48 32 48 48 Z" 
          fill="url(#paperGrad)" stroke="#D0C8B8" stroke-width="1.5"/>
    <!-- Top edge highlight -->
    <path d="M56 48 L200 48" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <!-- Left edge highlight -->
    <path d="M48 56 L48 216" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
    <!-- Fold corner -->
    <path d="M168 32 L168 64 L136 32 Z" fill="url(#paperTop)" stroke="#D0C8B8" stroke-width="1"/>
    <!-- Lines on paper -->
    <g stroke="#C8B8A8" stroke-width="0.8" opacity="0.6">
      <line x1="72" y1="80" x2="184" y2="80"/>
      <line x1="72" y1="104" x2="184" y2="104"/>
      <line x1="72" y1="128" x2="184" y2="128"/>
      <line x1="72" y1="152" x2="184" y2="152"/>
      <line x1="72" y1="176" x2="184" y2="176"/>
      <line x1="72" y1="200" x2="184" y2="200"/>
    </g>
    <!-- Margin line -->
    <line x1="72" y1="80" x2="72" y2="200" stroke="#E84038" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Pen -->
    <g transform="translate(140, 100) rotate(-30)">
      <path d="M-8,-40 L8,-40 L6,-8 Q0,-12 -6,-8 L-8,-40 Z" fill="url(#penBody)" stroke="#982820" stroke-width="1"/>
      <path d="M-6,-8 L-4,-4 Q0,-2 4,-4 L6,-8" fill="url(#penMetal)" stroke="#A8A098" stroke-width="1"/>
      <path d="M-2,-8 L-1,-4 Q0,-2 1,-4 L2,-8" fill="#F8F0E8" stroke="#D8D0C8" stroke-width="0.5"/>
      <!-- Clip -->
      <path d="M-10,-44 L-6,-40 L-6,-36 L-10,-40 Z" fill="#A8A098" stroke="#888078" stroke-width="0.5"/>
    </g>
  </g>
</svg>
