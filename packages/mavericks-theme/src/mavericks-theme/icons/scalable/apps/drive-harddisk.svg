<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="driveBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8C0B8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A8A098;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#989088;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="driveTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8D0C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8B0A8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="driveFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D0C8C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8B0A8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="driveSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8B0A8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#989088;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#787068;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#40E040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#28A828;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)" transform="translate(128, 128)">
    <!-- Drive main body (3D isometric) -->
    <!-- Right side -->
    <path d="M32,-40 L48,-24 L48,64 L32,80 Z" fill="url(#driveSide)"/>
    <!-- Top -->
    <path d="M-48,-40 L48,-24 L32,-40 L-48,-40 Z" fill="url(#driveTop)"/>
    <!-- Front -->
    <rect x="-48" y="-40" width="80" height="120" fill="url(#driveFront)" stroke="#888078" stroke-width="1.5"/>
    <!-- Front top edge -->
    <path d="M-48,-40 L32,-40" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <!-- Front left edge -->
    <path d="M-48,-40 L-48,80" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
    
    <!-- Drive details -->
    <!-- Label area -->
    <rect x="-36" y="-24" width="60" height="40" rx="3" ry="3" fill="#F0E8E0" stroke="#C8C0B8" stroke-width="1"/>
    <text x="6" y="-2" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#404040" text-anchor="middle">Macintosh HD</text>
    
    <!-- Activity light -->
    <circle cx="36" cy="52" r="6" fill="url(#lightGrad)" filter="url(#shadow)"/>
    <circle cx="36" cy="52" r="3" fill="#80FF80" opacity="0.5"/>
    
    <!-- Screws -->
    <circle cx="-40" cy="-32" r="3" fill="#787068" stroke="#585048" stroke-width="0.5"/>
    <circle cx="-40" cy="72" r="3" fill="#787068" stroke="#585048" stroke-width="0.5"/>
    <circle cx="28" cy="-32" r="3" fill="#787068" stroke="#585048" stroke-width="0.5"/>
    <circle cx="28" cy="72" r="3" fill="#787068" stroke="#585048" stroke-width="0.5"/>
    
    <!-- Ventilation slots -->
    <g stroke="#686058" stroke-width="1" opacity="0.5">
      <line x1="-36" y1="36" x2="20" y2="36"/>
      <line x1="-36" y1="44" x2="20" y2="44"/>
      <line x1="-36" y1="52" x2="20" y2="52"/>
      <line x1="-36" y1="60" x2="20" y2="60"/>
    </g>
  </g>
</svg>
