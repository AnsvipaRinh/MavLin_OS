<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="calcBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E8E0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E0D8D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0C8C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calcScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8E8C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8D8A8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F0E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8D0C8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="btnOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8C880;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0A860;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E89040;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Calculator body -->
    <rect x="40" y="24" width="176" height="208" rx="12" ry="12" fill="url(#calcBody)" stroke="#B8B0A8" stroke-width="2"/>
    <!-- Screen -->
    <rect x="52" y="36" width="152" height="48" rx="6" ry="6" fill="url(#calcScreen)" stroke="#98C898" stroke-width="1.5"/>
    <!-- Screen text "0" -->
    <text x="188" y="68" font-family="Monaco, monospace" font-size="28" font-weight="bold" fill="#2D4D2D" text-anchor="end">0</text>
  </g>
  
  <!-- Buttons -->
  <g filter="url(#btnShadow)">
    <g fill="url(#btnGrad)" stroke="#C8C0B8" stroke-width="1">
      <!-- Row 1 -->
      <rect x="52" y="100" width="34" height="34" rx="4" ry="4"/>
      <rect x="92" y="100" width="34" height="34" rx="4" ry="4"/>
      <rect x="132" y="100" width="34" height="34" rx="4" ry="4"/>
      <rect x="172" y="100" width="34" height="34" rx="4" ry="4" fill="url(#btnOrange)" stroke="#D88830"/>
      <!-- Row 2 -->
      <rect x="52" y="140" width="34" height="34" rx="4" ry="4"/>
      <rect x="92" y="140" width="34" height="34" rx="4" ry="4"/>
      <rect x="132" y="140" width="34" height="34" rx="4" ry="4"/>
      <rect x="172" y="140" width="34" height="34" rx="4" ry="4" fill="url(#btnOrange)" stroke="#D88830"/>
      <!-- Row 3 -->
      <rect x="52" y="180" width="34" height="34" rx="4" ry="4"/>
      <rect x="92" y="180" width="34" height="34" rx="4" ry="4"/>
      <rect x="132" y="180" width="34" height="34" rx="4" ry="4"/>
      <rect x="172" y="180" width="34" height="34" rx="4" ry="4" fill="url(#btnOrange)" stroke="#D88830"/>
      <!-- Row 4 -->
      <rect x="52" y="220" width="74" height="34" rx="4" ry="4"/>
      <rect x="132" y="220" width="34" height="34" rx="4" ry="4"/>
      <rect x="172" y="220" width="34" height="34" rx="4" ry="4" fill="url(#btnOrange)" stroke="#D88830"/>
    </g>
    
    <!-- Button labels -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#404040" text-anchor="middle" dominant-baseline="central">
      <text x="69" y="117">C</text>
      <text x="109" y="117">±</text>
      <text x="149" y="117">%</text>
      <text x="189" y="117" fill="#FFF">÷</text>
      <text x="69" y="157">7</text>
      <text x="109" y="157">8</text>
      <text x="149" y="157">9</text>
      <text x="189" y="157" fill="#FFF">×</text>
      <text x="69" y="197">4</text>
      <text x="109" y="197">5</text>
      <text x="149" y="197">6</text>
      <text x="189" y="197" fill="#FFF">−</text>
      <text x="89" y="237">1</text>
      <text x="149" y="237">2</text>
      <text x="189" y="237" fill="#FFF">+</text>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#404040" text-anchor="middle" dominant-baseline="central">
      <text x="69" y="237">0</text>
      <text x="149" y="237">.</text>
      <text x="189" y="237" fill="#FFF">=</text>
    </g>
  </g>
</svg>
