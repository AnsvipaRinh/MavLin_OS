<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fontBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F4E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8D0C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fontPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F4E8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Sample sheet -->
    <rect x="48" y="32" width="160" height="192" rx="4" ry="4" fill="url(#fontBody)" stroke="#C8C0B8" stroke-width="1.5"/>
    <!-- Page content area -->
    <rect x="60" y="44" width="136" height="168" rx="2" ry="2" fill="url(#fontPage)" stroke="#E8E0D0" stroke-width="1"/>
    
    <!-- Large A -->
    <text x="128" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="#302820" text-anchor="middle" dominant-baseline="central">A</text>
    
    <!-- Small a -->
    <text x="128" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#504840" text-anchor="middle" dominant-baseline="central">a</text>
    
    <!-- Font name -->
    <text x="128" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#403830" text-anchor="middle">Mavericks</text>
    <text x="128" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#605850" text-anchor="middle">Regular 14pt</text>
    
    <!-- Corner fold -->
    <path d="M188,44 L188,76 L156,44 Z" fill="#E8E0D0" stroke="#C8C0B8" stroke-width="1"/>
    
    <!-- Rulers -->
    <g stroke="#C8C0B8" stroke-width="1" opacity="0.5">
      <line x1="60" y1="44" x2="196" y2="44"/>
      <line x1="60" y1="212" x2="196" y2="212"/>
      <line x1="60" y1="44" x2="60" y2="212"/>
      <line x1="196" y1="44" x2="196" y2="212"/>
    </g>
  </g>
</svg>
