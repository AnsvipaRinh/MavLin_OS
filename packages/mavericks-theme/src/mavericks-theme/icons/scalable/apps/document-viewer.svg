<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="previewBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F4E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8D0C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="previewPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F4E8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="previewSidebar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8D0C8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Preview window -->
    <rect x="24" y="24" width="208" height="208" rx="8" ry="8" fill="url(#previewBody)" stroke="#C8C0B8" stroke-width="2"/>
    <!-- Title bar -->
    <rect x="24" y="24" width="208" height="28" rx="8" ry="8" fill="url(#previewSidebar)"/>
    <rect x="24" y="44" width="208" height="8" fill="url(#previewSidebar)"/>
    <!-- Window controls -->
    <circle cx="44" cy="38" r="6" fill="#E04040"/>
    <circle cx="64" cy="38" r="6" fill="#E0C040"/>
    <circle cx="84" cy="38" r="6" fill="#40E040"/>
    <text x="128" y="42" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#504840" text-anchor="middle">Preview</text>
    
    <!-- Sidebar -->
    <rect x="24" y="60" width="56" height="160" fill="url(#previewSidebar)" stroke="#D8D0C8" stroke-width="0.5"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#504840" text-anchor="middle">
      <text x="52" y="90">☰</text>
      <text x="52" y="110">📄</text>
      <text x="52" y="130">📄</text>
      <text x="52" y="150">📄</text>
    </g>
    
    <!-- Main document view -->
    <rect x="92" y="68" width="128" height="144" rx="2" ry="2" fill="url(#previewPage)" stroke="#E0D8D0" stroke-width="1"/>
    <!-- Document content -->
    <g font-family="Georgia, serif" fill="#302820" text-anchor="start">
      <text x="104" y="92" font-size="14" font-weight="bold">Document Title</text>
      <text x="104" y="116" font-size="11">Lorem ipsum dolor sit amet,</text>
      <text x="104" y="132" font-size="11">consectetur adipiscing elit.</text>
      <text x="104" y="148" font-size="11">Sed do eiusmod tempor</text>
      <text x="104" y="164" font-size="11">incididunt ut labore et</text>
      <text x="104" y="180" font-size="11">dolore magna aliqua.</text>
    </g>
    
    <!-- Thumbnail strip at bottom -->
    <rect x="32" y="180" width="52" height="72" rx="2" ry="2" fill="url(#previewPage)" stroke="#D8D0C8" stroke-width="1"/>
    <rect x="32" y="180" width="52" height="72" rx="2" ry="2" fill="#E8E0D0" opacity="0.5"/>
  </g>
</svg>
