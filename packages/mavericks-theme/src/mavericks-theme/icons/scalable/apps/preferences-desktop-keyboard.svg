<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D8D0C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8C0B8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0E8E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0D8D0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#383838;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#282828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#181818;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Keyboard body -->
    <rect x="28" y="60" width="200" height="120" rx="12" ry="12" fill="url(#kbBody)" stroke="#B8B0A8" stroke-width="2"/>
    
    <!-- Keys -->
    <g filter="url(#keyShadow)">
      <!-- Row 1: Function keys -->
      <g fill="url(#keyGrad)" stroke="#D8D0C8" stroke-width="1">
        <rect x="36" y="72" width="20" height="20" rx="3" ry="3"/>
        <rect x="60" y="72" width="20" height="20" rx="3" ry="3"/>
        <rect x="84" y="72" width="20" height="20" rx="3" ry="3"/>
        <rect x="108" y="72" width="20" height="20" rx="3" ry="3"/>
        <rect x="136" y="72" width="20" height="20" rx="3" ry="3"/>
        <rect x="160" y="72" width="20" height="20" rx="3" ry="3"/>
        <rect x="184" y="72" width="20" height="20" rx="3" ry="3"/>
        <rect x="208" y="72" width="20" height="20" rx="3" ry="3"/>
      </g>
      
      <!-- Row 2: Number row -->
      <g fill="url(#keyGrad)" stroke="#D8D0C8" stroke-width="1">
        <rect x="36" y="96" width="20" height="20" rx="3" ry="3"/>
        <rect x="60" y="96" width="20" height="20" rx="3" ry="3"/>
        <rect x="84" y="96" width="20" height="20" rx="3" ry="3"/>
        <rect x="108" y="96" width="20" height="20" rx="3" ry="3"/>
        <rect x="132" y="96" width="20" height="20" rx="3" ry="3"/>
        <rect x="156" y="96" width="20" height="20" rx="3" ry="3"/>
        <rect x="180" y="96" width="20" height="20" rx="3" ry="3"/>
        <rect x="204" y="96" width="20" height="20" rx="3" ry="3"/>
      </g>
      
      <!-- Row 3: QWERTY -->
      <g fill="url(#keyGrad)" stroke="#D8D0C8" stroke-width="1">
        <rect x="40" y="120" width="20" height="20" rx="3" ry="3"/>
        <rect x="64" y="120" width="20" height="20" rx="3" ry="3"/>
        <rect x="88" y="120" width="20" height="20" rx="3" ry="3"/>
        <rect x="112" y="120" width="20" height="20" rx="3" ry="3"/>
        <rect x="136" y="120" width="20" height="20" rx="3" ry="3"/>
        <rect x="160" y="120" width="20" height="20" rx="3" ry="3"/>
        <rect x="184" y="120" width="20" height="20" rx="3" ry="3"/>
        <rect x="208" y="120" width="20" height="20" rx="3" ry="3"/>
      </g>
      
      <!-- Row 4: ASDF -->
      <g fill="url(#keyGrad)" stroke="#D8D0C8" stroke-width="1">
        <rect x="48" y="144" width="20" height="20" rx="3" ry="3"/>
        <rect x="72" y="144" width="20" height="20" rx="3" ry="3"/>
        <rect x="96" y="144" width="20" height="20" rx="3" ry="3"/>
        <rect x="120" y="144" width="20" height="20" rx="3" ry="3"/>
        <rect x="144" y="144" width="20" height="20" rx="3" ry="3"/>
        <rect x="168" y="144" width="20" height="20" rx="3" ry="3"/>
        <rect x="192" y="144" width="20" height="20" rx="3" ry="3"/>
      </g>
      
      <!-- Row 5: ZXCV + Space -->
      <g fill="url(#keyGrad)" stroke="#D8D0C8" stroke-width="1">
        <rect x="56" y="168" width="20" height="20" rx="3" ry="3"/>
        <rect x="80" y="168" width="20" height="20" rx="3" ry="3"/>
        <rect x="104" y="168" width="20" height="20" rx="3" ry="3"/>
        <rect x="128" y="168" width="20" height="20" rx="3" ry="3"/>
        <rect x="152" y="168" width="20" height="20" rx="3" ry="3"/>
        <rect x="176" y="168" width="20" height="20" rx="3" ry="3"/>
        <!-- Space bar -->
        <rect x="68" y="168" width="100" height="20" rx="3" ry="3" fill="url(#keyDark)" stroke="#383838"/>
      </g>
    </g>
    
    <!-- Key labels (white keys) -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#303030" text-anchor="middle" dominant-baseline="central">
      <text x="46" y="82">F1</text>
      <text x="70" y="82">F2</text>
      <text x="94" y="82">F3</text>
      <text x="118" y="82">F4</text>
      <text x="146" y="82">F5</text>
      <text x="170" y="82">F6</text>
      <text x="194" y="82">F7</text>
      <text x="218" y="82">F8</text>
      <text x="46" y="106">1</text>
      <text x="70" y="106">2</text>
      <text x="94" y="106">3</text>
      <text x="118" y="106">4</text>
      <text x="142" y="106">5</text>
      <text x="166" y="106">6</text>
      <text x="190" y="106">7</text>
      <text x="214" y="106">8</text>
      <text x="50" y="130">Q</text>
      <text x="74" y="130">W</text>
      <text x="98" y="130">E</text>
      <text x="122" y="130">R</text>
      <text x="146" y="130">T</text>
      <text x="170" y="130">Y</text>
      <text x="194" y="130">U</text>
      <text x="218" y="130">I</text>
      <text x="58" y="154">A</text>
      <text x="82" y="154">S</text>
      <text x="106" y="154">D</text>
      <text x="130" y="154">F</text>
      <text x="154" y="154">G</text>
      <text x="178" y="154">H</text>
      <text x="202" y="154">J</text>
      <text x="66" y="178">Z</text>
      <text x="90" y="178">X</text>
      <text x="114" y="178">C</text>
      <text x="138" y="178">V</text>
      <text x="162" y="178">B</text>
      <text x="186" y="178">N</text>
      <text x="118" y="178" fill="#FFFFFF" font-size="9">Space</text>
    </g>
  </g>
</svg>
