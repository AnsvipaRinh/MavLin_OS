<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pickerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8D0C8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8C0B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8B0A8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pickerLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#282828;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#181818;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Eyedropper body -->
    <path d="M128,192 L128,120 Q128,80 96,80 L96,64 Q96,32 128,32 L160,32 Q192,32 192,64 L192,80 Q160,80 160,120 L160,192 Z" 
          fill="url(#pickerBody)" stroke="#A8A098" stroke-width="2"/>
    <!-- Tip -->
    <path d="M96,80 L128,120 L160,80 Z" fill="url(#pickerLens)" stroke="#181818" stroke-width="1.5"/>
    <circle cx="128" cy="96" r="12" fill="#0D0D0D"/>
    
    <!-- Color wheel in lens -->
    <g transform="translate(128, 96)">
      <circle r="10" fill="url(#colorWheel)"/>
    </g>
    
    <!-- Highlight on body -->
    <path d="M100,64 L100,112" stroke="#E8E0D8" stroke-width="1" opacity="0.4"/>
    
    <!-- Sampled color display -->
    <rect x="128" y="144" width="40" height="40" rx="4" ry="4" fill="#E04040" stroke="#A83030" stroke-width="1.5" filter="url(#glow)"/>
    <text x="148" y="170" font-family="Monaco, monospace" font-size="9" fill="#FFFFFF" text-anchor="middle">#E04040</text>
    
    <!-- RGB values -->
    <g font-family="Monaco, monospace" font-size="9" fill="#404040" text-anchor="start">
      <text x="48" y="152">R: 224</text>
      <text x="48" y="166">G: 064</text>
      <text x="48" y="180">B: 064</text>
    </g>
  </g>
  
  <defs>
    <radialGradient id="colorWheel" cx="0" cy="0" r="10">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="16.6%" stop-color="#FFFF00"/>
      <stop offset="33.3%" stop-color="#00FF00"/>
      <stop offset="50%" stop-color="#00FFFF"/>
      <stop offset="66.6%" stop-color="#0000FF"/>
      <stop offset="83.3%" stop-color="#FF00FF"/>
      <stop offset="100%" stop-color="#FF0000"/>
    </radialGradient>
  </defs>
</svg>
