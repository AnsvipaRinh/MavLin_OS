<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C83838;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B03030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#982828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookPages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F4E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8D0C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A82828;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#902020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A82828;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)" transform="translate(128, 128)">
    <!-- Book pages (fanned) -->
    <g fill="url(#bookPages)" stroke="#C8C0B8" stroke-width="0.5">
      <path d="M-72,-80 L-48,-80 L-40,80 L-76,80 Z"/>
      <path d="M-68,-76 L-44,-76 L-36,76 L-72,76 Z"/>
      <path d="M-64,-72 L-40,-72 L-32,72 L-68,72 Z"/>
      <path d="M-60,-68 L-36,-68 L-28,68 L-64,68 Z"/>
    </g>
    
    <!-- Book cover -->
    <path d="M-72,-80 L72,-80 L64,80 L-80,80 Z" fill="url(#bookCover)" stroke="#802020" stroke-width="2"/>
    <!-- Spine -->
    <path d="M-72,-80 L-80,-80 L-80,80 L-72,80 Z" fill="url(#bookSpine)" stroke="#701818" stroke-width="1"/>
    <!-- Cover highlight -->
    <path d="M-64,-72 L64,-72" stroke="#E06060" stroke-width="1" opacity="0.4"/>
    
    <!-- Gold lettering on spine -->
    <g font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#FFD840" text-anchor="middle" dominant-baseline="central" transform="rotate(-90)">
      <text x="0" y="-76" filter="url(#glow)">DICTIONARY</text>
    </g>
    
    <!-- Bookmark ribbon -->
    <path d="M60,-80 L72,-68 L72,80 L60,80 Z" fill="#E03030" stroke="#C02020" stroke-width="1"/>
    <path d="M64,-76 L70,-70 L70,76 L64,76 Z" fill="#F06060" opacity="0.5"/>
  </g>
</svg>
