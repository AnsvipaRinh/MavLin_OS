<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="launchpadBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F0E0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8D8C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8C8B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E8E0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="out"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Launchpad background -->
    <rect x="24" y="24" width="208" height="208" rx="24" ry="24" fill="url(#launchpadBg)" stroke="#C8B8A8" stroke-width="2"/>
    
    <!-- 4x4 grid of app icons -->
    <g transform="translate(48, 48)">
      <!-- Row 1 -->
      <g filter="url(#innerShadow)">
        <rect x="0" y="0" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <circle cx="20" cy="16" r="8" fill="#C84038"/>
        <rect x="48" y="0" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <rect x="12" y="12" width="16" height="16" rx="2" fill="#40A8E0"/>
        <rect x="96" y="0" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <path d="M108,12 L124,12 L124,28 L108,28 Z" fill="none" stroke="#3880C8" stroke-width="2"/>
        <rect x="144" y="0" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <circle cx="164" cy="20" r="10" fill="none" stroke="#E0A038" stroke-width="2"/>
      </g>
      <!-- Row 2 -->
      <g filter="url(#innerShadow)">
        <rect x="0" y="48" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <path d="M12,60 L28,60 L28,76 L12,76 Z" fill="none" stroke="#40C040" stroke-width="2"/>
        <rect x="48" y="48" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <circle cx="68" cy="68" r="10" fill="none" stroke="#C84038" stroke-width="2"/>
        <rect x="96" y="48" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <text x="116" y="74" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#404040" text-anchor="middle">A</text>
        <rect x="144" y="48" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <ellipse cx="164" cy="68" rx="10" ry="8" fill="none" stroke="#8060C0" stroke-width="2"/>
      </g>
      <!-- Row 3 -->
      <g filter="url(#innerShadow)">
        <rect x="0" y="96" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <polygon points="20,104 12,120 28,120" fill="#E04080"/>
        <rect x="48" y="96" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <rect x="56" y="104" width="24" height="12" rx="2" fill="#404040"/>
        <rect x="96" y="96" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <circle cx="116" cy="116" r="8" fill="#C038E0"/>
        <rect x="144" y="96" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <path d="M152,112 L176,112 L164,128 Z" fill="#40C0E0"/>
      </g>
      <!-- Row 4 -->
      <g filter="url(#innerShadow)">
        <rect x="0" y="144" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <text x="20" y="170" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3880C8" text-anchor="middle">⌘</text>
        <rect x="48" y="144" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <circle cx="68" cy="164" r="8" fill="#E0A038"/>
        <rect x="96" y="144" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <rect x="104" y="152" width="24" height="24" rx="4" fill="none" stroke="#40C040" stroke-width="2"/>
        <rect x="144" y="144" width="40" height="40" rx="8" ry="8" fill="url(#iconBg)" stroke="#D8D0C8" stroke-width="1"/>
        <path d="M152,156 L176,156 M164,148 L164,172" stroke="#C84038" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    
    <!-- Dots indicator -->
    <g transform="translate(128, 240)">
      <circle cx="-16" cy="0" r="3" fill="#A8A098"/>
      <circle cx="0" cy="0" r="4" fill="#888078"/>
      <circle cx="16" cy="0" r="3" fill="#A8A098"/>
    </g>
  </g>
</svg>
