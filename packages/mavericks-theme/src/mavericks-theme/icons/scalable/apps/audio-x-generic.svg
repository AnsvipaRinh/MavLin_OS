<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="noteBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C83838;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B03030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#982828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="noteHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E86060;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D85050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E86060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cdBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#D0C8C0;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#D0C8C0;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0C8C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cdInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8C0B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8A098;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- CD -->
    <circle cx="128" cy="128" r="96" fill="url(#cdBody)" stroke="#B8B0A8" stroke-width="2"/>
    <circle cx="128" cy="128" r="78" fill="url(#cdInner)" stroke="#A8A098" stroke-width="1"/>
    <circle cx="128" cy="128" r="18" fill="#989088" stroke="#888078" stroke-width="1"/>
    <circle cx="128" cy="128" r="10" fill="#0D0D0D"/>
    
    <!-- Rainbow reflection -->
    <g opacity="0.15" filter="url(#glow)">
      <path d="M50,128 A78,78 0 0,1 206,128" stroke="#FF0000" stroke-width="8" fill="none"/>
      <path d="M58,128 A70,70 0 0,1 198,128" stroke="#FF8000" stroke-width="6" fill="none"/>
      <path d="M66,128 A62,62 0 0,1 190,128" stroke="#FFFF00" stroke-width="5" fill="none"/>
      <path d="M74,128 A54,54 0 0,1 182,128" stroke="#00FF00" stroke-width="4" fill="none"/>
      <path d="M82,128 A46,46 0 0,1 174,128" stroke="#00FFFF" stroke-width="3" fill="none"/>
      <path d="M90,128 A38,38 0 0,1 166,128" stroke="#0080FF" stroke-width="2" fill="none"/>
      <path d="M98,128 A30,30 0 0,1 158,128" stroke="#8000FF" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Music note overlay -->
    <g transform="translate(128, 128)" fill="url(#noteBody)" stroke="#802020" stroke-width="1.5" filter="url(#glow)">
      <!-- Note head -->
      <ellipse cx="-18" cy="24" rx="14" ry="10" transform="rotate(-20)"/>
      <ellipse cx="18" cy="24" rx="14" ry="10" transform="rotate(20)"/>
      <!-- Stems -->
      <path d="M-4,24 L-4,-40" stroke-width="5"/>
      <path d="M4,24 L4,-40" stroke-width="5"/>
      <!-- Beam -->
      <path d="M-4,-40 L4,-40" stroke-width="6"/>
      <path d="M-4,-46 L4,-46" stroke-width="6"/>
    </g>
  </g>
</svg>
