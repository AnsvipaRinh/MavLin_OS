<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gearBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D0C8C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8B0A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A09890;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gearInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0C8C0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)" transform="translate(128, 128)">
    <!-- Outer gear teeth -->
    <g fill="url(#gearBody)" stroke="#888078" stroke-width="1.5">
      <path d="M0,-72 L-6,-60 L-10,-62 L-6,-64 L0,-52 L6,-64 L10,-62 L6,-60 Z"/>
      <path d="M72,0 L60,-6 L62,-10 L64,-6 L52,0 L64,6 L62,10 L60,6 Z"/>
      <path d="M0,72 L6,60 L10,62 L6,64 L0,52 L-6,64 L-10,62 L-6,60 Z"/>
      <path d="M-72,0 L-60,6 L-62,10 L-64,6 L-52,0 L-64,-6 L-62,-10 L-60,-6 Z"/>
      <!-- Diagonal teeth -->
      <path d="M46,-46 L38,-38 L40,-42 L36,-44 L28,-36 L36,-44 L40,-42 L38,-38 Z" transform="rotate(45)"/>
      <path d="M46,46 L38,38 L40,42 L36,44 L28,36 L36,44 L40,42 L38,38 Z" transform="rotate(-45)"/>
      <path d="M-46,46 L-38,38 L-40,42 L-36,44 L-28,36 L-36,44 L-40,42 L-38,38 Z" transform="rotate(45)"/>
      <path d="M-46,-46 L-38,-38 L-40,-42 L-36,-44 L-28,-36 L-36,-44 L-40,-42 L-38,-38 Z" transform="rotate(-45)"/>
    </g>
    
    <!-- Main gear circle -->
    <circle r="52" fill="url(#gearBody)" stroke="#888078" stroke-width="2"/>
    <circle r="40" fill="url(#gearInner)" stroke="#989088" stroke-width="1"/>
    
    <!-- Center hole -->
    <circle r="18" fill="#181818"/>
    <circle r="12" fill="#282828"/>
    <circle r="8" fill="#383838"/>
    <circle r="4" fill="#484848"/>
    
    <!-- Inner gear teeth -->
    <g fill="#686058" stroke="#585048" stroke-width="1">
      <path d="M0,-32 L-4,-28 L-6,-29 L-4,-30 L0,-24 L4,-30 L6,-29 L4,-28 Z"/>
      <path d="M32,0 L28,-4 L29,-6 L30,-4 L24,0 L30,4 L29,6 L28,4 Z"/>
      <path d="M0,32 L4,28 L6,29 L4,30 L0,24 L-4,30 L-6,29 L-4,28 Z"/>
      <path d="M-32,0 L-28,4 L-29,6 L-30,4 L-24,0 L-30,-4 L-29,-6 L-28,-4 Z"/>
    </g>
  </g>
</svg>
