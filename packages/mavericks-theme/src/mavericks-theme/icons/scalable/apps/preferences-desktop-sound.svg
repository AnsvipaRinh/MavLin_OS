<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="speakerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D0C8C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8B0A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A09890;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="speakerCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#383838;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#282828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#181818;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#40A8E0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3890C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40A8E0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Speaker cabinet -->
    <rect x="56" y="48" width="144" height="160" rx="8" ry="8" fill="url(#speakerBody)" stroke="#989088" stroke-width="2"/>
    <!-- Front grille -->
    <rect x="64" y="56" width="128" height="144" rx="6" ry="6" fill="#181818" stroke="#282828" stroke-width="1"/>
    <g stroke="#383838" stroke-width="0.5" opacity="0.5">
      <line x1="72" y1="56" x2="72" y2="200"/>
      <line x1="88" y1="56" x2="88" y2="200"/>
      <line x1="104" y1="56" x2="104" y2="200"/>
      <line x1="120" y1="56" x2="120" y2="200"/>
      <line x1="136" y1="56" x2="136" y2="200"/>
      <line x1="152" y1="56" x2="152" y2="200"/>
      <line x1="168" y1="56" x2="168" y2="200"/>
      <line x1="184" y1="56" x2="184" y2="200"/>
    </g>
    
    <!-- Woofer -->
    <circle cx="128" cy="152" r="36" fill="url(#speakerCone)" stroke="#282828" stroke-width="2"/>
    <circle cx="128" cy="152" r="28" fill="#1E1E1E" stroke="#383838" stroke-width="1"/>
    <circle cx="128" cy="152" r="18" fill="#282828" stroke="#383838" stroke-width="1"/>
    <circle cx="128" cy="152" r="10" fill="#383838"/>
    <circle cx="128" cy="152" r="4" fill="#484848"/>
    
    <!-- Tweeter -->
    <circle cx="128" cy="80" r="16" fill="url(#speakerCone)" stroke="#282828" stroke-width="1.5"/>
    <circle cx="128" cy="80" r="10" fill="#1E1E1E"/>
    <circle cx="128" cy="80" r="5" fill="#282828"/>
    
    <!-- Volume waves -->
    <g filter="url(#glow)" stroke="url(#waveGrad)" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M210,152 Q230,132 240,152 Q230,172 210,152"/>
      <path d="M220,132 Q250,100 260,132 Q250,164 220,132" opacity="0.6"/>
      <path d="M230,112 Q270,64 280,112 Q270,160 230,112" opacity="0.3"/>
    </g>
    
    <!-- Volume knob -->
    <circle cx="200" cy="60" r="14" fill="url(#speakerBody)" stroke="#989088" stroke-width="1.5"/>
    <path d="M192,60 L208,60" stroke="#484038" stroke-width="2" stroke-linecap="round"/>
    <circle cx="200" cy="60" r="4" fill="#686058"/>
  </g>
</svg>
