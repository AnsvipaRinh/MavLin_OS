<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D8C0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D8C8B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8B8A0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E0C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8C8B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D8C8B0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8A890;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#988870;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F0E8;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#E8E0D8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#D8D0C8;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)" transform="translate(128, 136)">
    <!-- Box bottom -->
    <path d="M-64,-8 L64,-8 L72,8 L-72,8 Z" fill="url(#boxBody)" stroke="#A89880" stroke-width="2"/>
    <!-- Box right side -->
    <path d="M64,-8 L72,8 L72,80 L64,64 Z" fill="url(#boxSide)" stroke="#988870" stroke-width="1"/>
    <!-- Box front -->
    <rect x="-64" y="-8" width="128" height="72" fill="url(#boxBody)" stroke="#A89880" stroke-width="1.5"/>
    <!-- Front top edge highlight -->
    <path d="M-64,-8 L64,-8" stroke="#F8E8D8" stroke-width="1" opacity="0.5"/>
    <!-- Left edge highlight -->
    <path d="M-64,-8 L-64,64" stroke="#F8E8D8" stroke-width="1" opacity="0.3"/>
    
    <!-- Flaps -->
    <!-- Top flap -->
    <path d="M-64,-8 L-48,-24 L48,-24 L64,-8 Z" fill="url(#boxTop)" stroke="#B8A890" stroke-width="1.5"/>
    <!-- Right flap -->
    <path d="M64,-8 L72,8 L72,-16 L64,-8 Z" fill="url(#boxSide)" stroke="#988870" stroke-width="1"/>
    
    <!-- Tape -->
    <path d="M-48,-24 L48,-24 L48,-16 L-48,-16 Z" fill="url(#tapeGrad)" stroke="#D8D0C8" stroke-width="0.5" opacity="0.9"/>
    <!-- Tape texture -->
    <g stroke="#C8C0B8" stroke-width="0.5" opacity="0.4">
      <line x1="-40" y1="-22" x2="-40" y2="-18"/>
      <line x1="-20" y1="-22" x2="-20" y2="-18"/>
      <line x1="0" y1="-22" x2="0" y2="-18"/>
      <line x1="20" y1="-22" x2="20" y2="-18"/>
      <line x1="40" y1="-22" x2="40" y2="-18"/>
    </g>
    
    <!-- Box labeling -->
    <text x="0" y="16" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#504840" text-anchor="middle">Archive</text>
    <text x="0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#706860" text-anchor="middle">.zip .tar .gz</text>
    
    <!-- Handle holes -->
    <ellipse cx="-32" cy="20" rx="10" ry="5" fill="#0D0D0D" opacity="0.3"/>
    <ellipse cx="32" cy="20" rx="10" ry="5" fill="#0D0D0D" opacity="0.3"/>
  </g>
</svg>
