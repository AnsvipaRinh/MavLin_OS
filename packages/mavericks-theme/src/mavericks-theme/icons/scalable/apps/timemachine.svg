<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clockBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F0E0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8D8C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8C8B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clockFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F8F4E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E8D8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clockRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8B8A8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A89888;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#988878;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C83838;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A02828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3880C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2860A0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)" transform="translate(128, 128)">
    <!-- Clock outer rim -->
    <circle r="96" fill="url(#clockRim)" stroke="#887868" stroke-width="2"/>
    <!-- Clock face -->
    <circle r="84" fill="url(#clockFace)" stroke="#B8A898" stroke-width="1.5"/>
    
    <!-- Hour markers -->
    <g stroke="#403830" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-72" x2="0" y2="-62"/>  <!-- 12 -->
      <line x1="62" y1="0" x2="72" y2="0"/>     <!-- 3 -->
      <line x1="0" y1="62" x2="0" y2="72"/>     <!-- 6 -->
      <line x1="-72" y1="0" x2="-62" y2="0"/>  <!-- 9 -->
    </g>
    <g stroke="#605850" stroke-width="1.5" stroke-linecap="round">
      <line x1="31" y1="-54" x2="38" y2="-66"/>  <!-- 1 -->
      <line x1="54" y1="-31" x2="66" y2="-38"/>  <!-- 2 -->
      <line x1="54" y1="31" x2="66" y2="38"/>    <!-- 4 -->
      <line x1="31" y1="54" x2="38" y2="66"/>    <!-- 5 -->
      <line x1="-31" y1="54" x2="-38" y2="66"/>  <!-- 7 -->
      <line x1="-54" y1="31" x2="-66" y2="38"/>  <!-- 8 -->
      <line x1="-54" y1="-31" x2="-66" y2="-38"/> <!-- 10 -->
      <line x1="-31" y1="-54" x2="-38" y2="-66"/> <!-- 11 -->
    </g>
    
    <!-- Numbers -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#302820" text-anchor="middle" dominant-baseline="central">
      <text x="0" y="-50">12</text>
      <text x="50" y="6">3</text>
      <text x="0" y="56">6</text>
      <text x="-50" y="6">9</text>
    </g>
    
    <!-- Hour hand -->
    <path d="M0,0 L-4,-6 L0,-50 L4,-6 Z" fill="url(#arrowGrad)" stroke="#802020" stroke-width="1"/>
    <!-- Minute hand -->
    <path d="M0,0 L-3,-6 L0,-68 L3,-6 Z" fill="url(#arrowBlue)" stroke="#205080" stroke-width="1"/>
    <!-- Second hand -->
    <path d="M0,8 L0,-72" stroke="#C83838" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="0" cy="8" r="6" fill="#C83838"/>
    <circle cx="0" cy="8" r="3" fill="#FF6060"/>
    
    <!-- Center dot -->
    <circle r="6" fill="#302820"/>
    <circle r="3" fill="#504840"/>
    
    <!-- Counter-clockwise arrow (Time Machine) -->
    <g transform="translate(0, -80)" stroke="#C83838" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)">
      <path d="M-20,0 A20,20 0 0,0 20,0"/>
      <path d="M20,0 L30,-10 M20,0 L30,10"/>
    </g>
    <text x="0" y="-96" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#C83838" text-anchor="middle">BACK IN TIME</text>
  </g>
</svg>
