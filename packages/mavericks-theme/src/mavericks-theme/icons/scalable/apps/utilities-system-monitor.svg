<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monitorBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#282828;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E1E1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141414;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="monitorScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1A0D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#081208;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#40E040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#28A828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4080E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2860A8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E04040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A82828;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Monitor -->
    <rect x="36" y="24" width="184" height="160" rx="8" ry="8" fill="url(#monitorBody)" stroke="#383838" stroke-width="3"/>
    <rect x="48" y="36" width="160" height="120" rx="4" ry="4" fill="url(#monitorScreen)" stroke="#1A2A1A" stroke-width="1"/>
    <!-- Stand -->
    <path d="M118 184 L118 208 Q118 216 128 216 L128 216 Q138 216 138 208 L138 184 Z" fill="#383838"/>
    <ellipse cx="128" cy="220" rx="22" ry="5" fill="#282828" stroke="#383838" stroke-width="1"/>
  </g>
  
  <!-- CPU Chart bars -->
  <g transform="translate(56, 52)">
    <g fill="url(#chartGreen)" filter="url(#glow)">
      <rect x="8" y="80" width="16" height="40" rx="2"/>
      <rect x="32" y="60" width="16" height="60" rx="2"/>
      <rect x="56" y="70" width="16" height="50" rx="2"/>
      <rect x="80" y="50" width="16" height="70" rx="2"/>
      <rect x="104" y="40" width="16" height="80" rx="2"/>
      <rect x="128" y="30" width="16" height="90" rx="2"/>
    </g>
  </g>
  
  <!-- Memory Chart bars -->
  <g transform="translate(56, 116)">
    <g fill="url(#chartBlue)" filter="url(#glow)">
      <rect x="8" y="20" width="16" height="60" rx="2"/>
      <rect x="32" y="10" width="16" height="70" rx="2"/>
      <rect x="56" y="30" width="16" height="50" rx="2"/>
      <rect x="80" y="40" width="16" height="40" rx="2"/>
      <rect x="104" y="20" width="16" height="60" rx="2"/>
      <rect x="128" y="10" width="16" height="70" rx="2"/>
    </g>
  </g>
  
  <!-- Network/Activity indicators -->
  <g transform="translate(56, 180)">
    <circle cx="20" cy="10" r="6" fill="#40E040" filter="url(#glow)"/>
    <circle cx="50" cy="10" r="6" fill="#E0E040" filter="url(#glow)"/>
    <circle cx="80" cy="10" r="6" fill="#E04040" filter="url(#glow)"/>
    <circle cx="110" cy="10" r="6" fill="#4080E0" filter="url(#glow)"/>
  </g>
</svg>
