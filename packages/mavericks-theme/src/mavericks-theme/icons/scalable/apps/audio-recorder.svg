<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="micBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C83838;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B03030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#982828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="micGrille" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#383838;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#282828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#181818;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="micStand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8C0B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8A098;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="micHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E86060;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D85050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E86060;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Microphone stand base -->
    <ellipse cx="128" cy="210" rx="50" ry="12" fill="url(#micStand)" stroke="#989088" stroke-width="1.5"/>
    <ellipse cx="128" cy="210" rx="42" ry="8" fill="#D8D0C8"/>
    
    <!-- Stand neck -->
    <rect x="122" y="130" width="12" height="80" fill="url(#micStand)" stroke="#B8B0A8" stroke-width="1"/>
    <rect x="124" y="132" width="8" height="76" fill="#E0D8D0"/>
    
    <!-- Microphone body -->
    <rect x="98" y="48" width="60" height="88" rx="30" ry="30" fill="url(#micBody)" stroke="#802020" stroke-width="2"/>
    <!-- Grille -->
    <rect x="104" y="56" width="48" height="72" rx="24" ry="24" fill="url(#micGrille)"/>
    <g stroke="#484848" stroke-width="0.8" opacity="0.6">
      <line x1="112" y1="60" x2="112" y2="120"/>
      <line x1="120" y1="60" x2="120" y2="120"/>
      <line x1="128" y1="60" x2="128" y2="120"/>
      <line x1="136" y1="60" x2="136" y2="120"/>
      <line x1="144" y1="60" x2="144" y2="120"/>
    </g>
    <!-- Highlight on mic -->
    <path d="M110,56 L110,128" stroke="url(#micHighlight)" stroke-width="2" opacity="0.4"/>
    
    <!-- Record indicator -->
    <circle cx="128" cy="32" r="10" fill="#E03030" filter="url(#glow)"/>
    <circle cx="128" cy="32" r="6" fill="#FF6060"/>
    
    <!-- Sound waves -->
    <g stroke="#C83838" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6">
      <path d="M160,80 Q180,64 200,80"/>
      <path d="M170,100 Q200,64 230,100" opacity="0.4"/>
      <path d="M180,120 Q220,64 260,120" opacity="0.2"/>
    </g>
  </g>
</svg>
