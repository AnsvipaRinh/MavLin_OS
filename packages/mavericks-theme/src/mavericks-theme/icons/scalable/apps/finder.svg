<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="folderTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0C8B0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="folderBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E8D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8E0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8D0C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0D8C8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="-2"/>
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="out"/>
    </filter>
  </defs>
  
  <!-- Folder shadow -->
  <g filter="url(#shadow)">
    <!-- Tab -->
    <path d="M32 96 L32 72 Q32 56 48 56 L176 56 Q192 56 192 72 L192 96 Z" 
          fill="url(#tabGrad)" stroke="#C8C0B0" stroke-width="1.5"/>
    <!-- Body -->
    <path d="M24 96 L24 216 Q24 232 40 232 L216 232 Q232 232 232 216 L232 96 Z" 
          fill="url(#folderBody)" stroke="#C0B8A8" stroke-width="1.5"/>
  </g>
  
  <!-- Highlight on tab -->
  <path d="M36 72 L172 72" stroke="#FAF4E8" stroke-width="1" opacity="0.6"/>
  
  <!-- Folder label area highlight -->
  <path d="M40 104 L216 104" stroke="#FAF4E8" stroke-width="1" opacity="0.4"/>
  
  <!-- Finder face - classic Mavericks happy mac style -->
  <g transform="translate(80, 130)">
    <!-- Left eye -->
    <ellipse cx="24" cy="12" rx="8" ry="10" fill="#2D2D2D"/>
    <ellipse cx="26" cy="10" rx="2.5" ry="3" fill="#FFFFFF" opacity="0.9"/>
    <!-- Right eye -->
    <ellipse cx="56" cy="12" rx="8" ry="10" fill="#2D2D2D"/>
    <ellipse cx="58" cy="10" rx="2.5" ry="3" fill="#FFFFFF" opacity="0.9"/>
    <!-- Smile -->
    <path d="M18 32 Q40 48 62 32" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle texture lines on folder body -->
  <g opacity="0.08" stroke="#000000" stroke-width="0.5">
    <line x1="40" y1="120" x2="216" y2="120"/>
    <line x1="40" y1="140" x2="216" y2="140"/>
    <line x1="40" y1="160" x2="216" y2="160"/>
    <line x1="40" y1="180" x2="216" y2="180"/>
    <line x1="40" y1="200" x2="216" y2="200"/>
  </g>
</svg>
