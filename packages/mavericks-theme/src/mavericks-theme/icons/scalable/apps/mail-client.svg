<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mailBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3880E0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3068C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2850A8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mailFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4090F0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3878D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3060C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mailInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F4E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E0D0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mailHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A8FF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#60A8FF;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Envelope body -->
    <path d="M40,72 L40,192 Q40,208 56,208 L200,208 Q216,208 216,192 L216,72 Z" 
          fill="url(#mailBody)" stroke="#204080" stroke-width="2"/>
    <!-- Flap -->
    <path d="M40,72 L128,24 L216,72 Z" fill="url(#mailFlap)" stroke="#2850A0" stroke-width="2"/>
    <!-- Flap highlight -->
    <path d="M60,56 L128,32 L196,56" stroke="url(#mailHighlight)" stroke-width="2" fill="none"/>
    
    <!-- Stamp -->
    <rect x="156" y="84" width="48" height="48" rx="4" ry="4" fill="url(#mailInside)" stroke="#E0A040" stroke-width="2"/>
    <circle cx="180" cy="108" r="14" fill="#FFFFFF" stroke="#E0A040" stroke-width="1.5"/>
    <text x="180" y="114" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#E0A040" text-anchor="middle">✉</text>
    
    <!-- Air mail border -->
    <g stroke="#C83838" stroke-width="2" stroke-dasharray="6,4" opacity="0.6">
      <path d="M48,80 L208,80"/>
      <path d="M48,184 L208,184"/>
    </g>
    <text x="128" y="120" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#C83838" text-anchor="middle">AIR MAIL</text>
    
    <!-- Postmark -->
    <circle cx="80" cy="100" r="20" fill="none" stroke="#807060" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="80" y="106" font-family="Georgia, serif" font-size="10" fill="#807060" text-anchor="middle">CUPERTINO</text>
    <text x="80" y="116" font-family="Georgia, serif" font-size="8" fill="#807060" text-anchor="middle">SEP 30 2009</text>
  </g>
</svg>
