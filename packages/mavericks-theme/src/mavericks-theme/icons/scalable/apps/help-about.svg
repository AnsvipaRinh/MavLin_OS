<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="infoBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D8D0C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8C0B8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="infoHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Info badge shape (rounded square, not Apple silhouette) -->
    <rect x="28" y="24" width="200" height="184" rx="24" ry="24" 
          fill="url(#infoBody)" stroke="#A8A098" stroke-width="2"/>
    <!-- Highlight -->
    <rect x="36" y="32" width="184" height="60" rx="16" ry="16" 
          fill="url(#infoHighlight)"/>
    <!-- Info symbol (i in circle) -->
    <circle cx="128" cy="80" r="28" fill="#007AFF" stroke="#0056CC" stroke-width="1.5"/>
    <text x="128" y="88" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">i</text>
    <!-- Version text -->
    <text x="128" y="156" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#303030" text-anchor="middle">Mavericks Linux</text>
    <text x="128" y="176" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#202020" text-anchor="middle">OS X 10.9 Style</text>
    <text x="128" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#606060" text-anchor="middle">Build 2026.10</text>
  </g>
</svg>