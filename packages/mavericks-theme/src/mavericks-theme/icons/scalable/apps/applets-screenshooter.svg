<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cameraBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#383838;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#282828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#181818;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cameraLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2850A0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#183880;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D2060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cameraGrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8B8A8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A89888;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#988878;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8A0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFE880;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD860;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Camera body -->
    <path d="M48,80 L48,176 Q48,192 64,192 L192,192 Q208,192 208,176 L208,80 Q208,64 192,64 L160,64 L152,48 Q148,32 128,32 Q108,32 104,48 L96,64 L64,64 Q48,64 48,80 Z" 
          fill="url(#cameraBody)" stroke="#282828" stroke-width="2"/>
    <!-- Grip -->
    <path d="M48,80 L64,80 L64,120 Q64,136 80,136 L176,136 Q192,136 192,120 L192,80 L208,80" 
          fill="url(#cameraGrip)" stroke="#887868" stroke-width="1.5"/>
    
    <!-- Lens outer ring -->
    <circle cx="128" cy="116" r="42" fill="#181818" stroke="#282828" stroke-width="3"/>
    <!-- Lens inner ring -->
    <circle cx="128" cy="116" r="34" fill="url(#cameraLens)" stroke="#183880" stroke-width="2"/>
    <!-- Lens glass -->
    <circle cx="128" cy="116" r="26" fill="#0D1A3A" stroke="#183060" stroke-width="1"/>
    <!-- Lens reflection -->
    <ellipse cx="118" cy="106" rx="8" ry="5" fill="#FFFFFF" opacity="0.3"/>
    <ellipse cx="122" cy="110" rx="4" ry="2" fill="#FFFFFF" opacity="0.5"/>
    
    <!-- Aperture blades hint -->
    <g stroke="#385080" stroke-width="1" opacity="0.4">
      <line x1="128" y1="90" x2="128" y2="98"/>
      <line x1="128" y1="134" x2="128" y2="142"/>
      <line x1="90" y1="116" x2="98" y2="116"/>
      <line x1="158" y1="116" x2="166" y2="116"/>
    </g>
    
    <!-- Flash -->
    <rect x="184" y="56" width="20" height="20" rx="3" ry="3" fill="url(#flashGrad)" stroke="#E8D860" stroke-width="1.5" filter="url(#glow)"/>
    <text x="194" y="70" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#A88020" text-anchor="middle">⚡</text>
    
    <!-- Shutter button -->
    <circle cx="80" cy="48" r="12" fill="#C83838" stroke="#A02828" stroke-width="2" filter="url(#glow)"/>
    <circle cx="80" cy="48" r="7" fill="none" stroke="#E06060" stroke-width="1.5"/>
    
    <!-- Mode dial -->
    <circle cx="200" cy="48" r="12" fill="url(#cameraBody)" stroke="#383838" stroke-width="2"/>
    <line x1="200" y1="40" x2="200" y2="34" stroke="#FFF8A0" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
