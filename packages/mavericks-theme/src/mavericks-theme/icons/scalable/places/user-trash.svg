<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trashBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8B8A8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B0A090;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#988878;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trashLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D8C8B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8A898;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="trashMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E0D8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D0C8C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8B0A8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Trash body -->
    <path d="M64 96 L64 216 Q64 232 80 232 L176 232 Q192 232 192 216 L192 96 Z" 
          fill="url(#trashBody)" stroke="#887868" stroke-width="1.5"/>
    <!-- Lid -->
    <path d="M56 80 L56 96 Q56 112 72 112 L184 112 Q200 112 200 96 L200 80 Z" 
          fill="url(#trashLid)" stroke="#A09080" stroke-width="1.5"/>
    <!-- Handle -->
    <path d="M104 64 Q128 48 152 64" stroke="url(#trashMetal)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M108 68 Q128 56 148 68" stroke="#F0E8E0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Vertical lines on body -->
  <g opacity="0.12" stroke="#000000" stroke-width="1">
    <line x1="96" y1="112" x2="96" y2="216"/>
    <line x1="128" y1="112" x2="128" y2="216"/>
    <line x1="160" y1="112" x2="160" y2="216"/>
  </g>
  
  <!-- Highlight on lid -->
  <path d="M64 96 L192 96" stroke="#E8D8C8" stroke-width="1" opacity="0.5"/>
</svg>
