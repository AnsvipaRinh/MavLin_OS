    <path d="M16,30 L16,22 L22,26 L16,30 Z"/>  <!-- Down -->
    <path d="M2,16 L10,16 L6,22 L2,16 Z"/>  <!-- Left -->
    <path d="M30,16 L22,16 L26,22 L30,16 Z"/>  <!-- Right -->
  </g>
  <g fill="#FFFFFF" opacity="0.12">
    <path d="M16,3 L16,9 L21,6 L16,3 Z"/>
    <path d="M16,29 L16,23 L21,26 L16,29 Z"/>
    <path d="M3,16 L9,16 L6,21 L3,16 Z"/>
    <path d="M29,16 L23,16 L26,21 L29,16 Z"/>
  </g>
</svg>
