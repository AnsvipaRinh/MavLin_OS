<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Crosshair cursor -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="#000000" stroke-width="2" opacity="0.85" filter="url(#shadow)"/>
  <line x1="2" y1="16" x2="30" y2="16" stroke="#000000" stroke-width="2" opacity="0.85" filter="url(#shadow)"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.85" filter="url(#shadow)"/>
  <line x1="16" y1="2" x2="16" y2="30" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>
  <line x1="2" y1="16" x2="30" y2="16" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>
</svg>
