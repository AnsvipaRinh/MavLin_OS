<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.65" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Wait cursor (alias of watch) -->
  <circle cx="16" cy="16" r="14" fill="url(#cursorGrad)" stroke="#000000" stroke-width="1.5" opacity="0.9" filter="url(#shadow)"/>
  <ellipse cx="12" cy="12" rx="6" ry="4" fill="#FFFFFF" opacity="0.15"/>
  <g fill="#FFFFFF" opacity="0.6">
    <line x1="16" y1="4" x2="16" y2="8" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="16" x2="28" y2="16" stroke-width="2" stroke-linecap="round" transform="rotate(30 16 16)"/>
    <line x1="24" y1="16" x2="28" y2="16" stroke-width="2" stroke-linecap="round" transform="rotate(60 16 16)"/>
    <line x1="24" y1="16" x2="28" y2="16" stroke-width="2" stroke-linecap="round" transform="rotate(90 16 16)"/>
    <line x1="24" y1="16" x2="28" y2="16" stroke-width="2" stroke-linecap="round" transform="rotate(120 16 16)"/>
    <line x1="24" y1="16" x2="28" y2="16" stroke-width="2" stroke-linecap="round" transform="rotate(150 16 16)"/>
    <line x1="16" y1="24" x2="16" y2="28" stroke-width="2" stroke-linecap="round" transform="rotate(180 16 16)"/>
  </g>
</svg>
