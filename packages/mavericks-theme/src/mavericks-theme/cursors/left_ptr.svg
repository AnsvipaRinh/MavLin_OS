<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.65" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Classic Mac arrow cursor (Mavericks style) -->
  <path d="M0,0 L16,16 L8,16 L12,20 L6,26 L10,18 L0,18 Z" 
        fill="url(#cursorGrad)" stroke="#000000" stroke-width="1" opacity="0.9" filter="url(#shadow)"/>
  <!-- White highlight -->
  <path d="M1,1 L14,15 L7,15 L10,18 L5,23 L8,17 L1,17 Z" 
        fill="#FFFFFF" opacity="0.15"/>
</svg>
