<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- I-beam text cursor -->
  <rect x="14" y="2" width="4" height="28" rx="1" ry="1" fill="#000000" opacity="0.85" filter="url(#shadow)"/>
  <rect x="2" y="14" width="28" height="4" rx="1" ry="1" fill="#000000" opacity="0.85" filter="url(#shadow)"/>
  <rect x="14" y="2" width="4" height="28" rx="1" ry="1" fill="#FFFFFF" opacity="0.12"/>
  <rect x="2" y="14" width="28" height="4" rx="1" ry="1" fill="#FFFFFF" opacity="0.12"/>
</svg>
