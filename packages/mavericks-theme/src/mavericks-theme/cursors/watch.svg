<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.65" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="0.1"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Spinning beach ball / watch cursor (Mavericks style) -->
  <circle cx="16" cy="16" r="14" fill="url(#cursorGrad)" stroke="#000000" stroke-width="1.5" opacity="0.9" filter="url(#shadow)"/>
  <!-- Highlight -->
  <ellipse cx="12" cy="12" rx="6" ry="4" fill="#FFFFFF" opacity="0.15"/>
  <!-- Spinner segments -->
  <g fill="#FFFFFF" opacity="0.6" filter="url(#glow)">
    <path d="M16,4 L16,8"/>
    <path d="M24,16 L28,16" transform="rotate(30 16 16)"/>
    <path d="M24,16 L28,16" transform="rotate(60 16 16)"/>
    <path d="M24,16 L28,16" transform="rotate(90 16 16)"/>
    <path d="M24,16 L28,16" transform="rotate(120 16 16)"/>
    <path d="M24,16 L28,16" transform="rotate(150 16 16)"/>
    <path d="M16,24 L16,28" transform="rotate(180 16 16)"/>
  </g>
</svg>
