# MacBook 12" Cirrus Logic CS4208 audio codec
#
# No module options are set. Both options that were here before are no-ops
# or owned by another mechanism (see docs/DECISIONS.md D4, 2026-09-28):
#
# - model=macbook12 was a no-op: the A1534 initialization is unconditional
#   in the DKMS snd-hda-codec-cs420x module (patch_cs4208() calls
#   setup_a1534() + play_a1534() for every CS4208), and the driver's model
#   fixup tables (gpio0/mba6/mbp11/macmini) contain no "macbook12" entry.
#
# - power_save=1 / power_save_controller=Y duplicated TLP, which owns
#   audio power management in the frozen baseline ("TLP only"). TLP 1.9.1
#   defaults: SOUND_POWER_SAVE_ON_AC=1, SOUND_POWER_SAVE_ON_BAT=1,
#   SOUND_POWER_SAVE_CONTROLLER=Y — audio power save is enabled on AC and
#   battery out of the box.
