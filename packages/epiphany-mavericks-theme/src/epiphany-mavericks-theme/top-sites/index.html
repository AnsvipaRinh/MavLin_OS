<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Sites — Mavericks Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header with search -->
        <header class="toolbar">
            <div class="toolbar-left">
                <div class="traffic-lights" role="img" aria-label="Window controls">
                    <span class="light close" title="Close"></span>
                    <span class="light minimize" title="Minimize"></span>
                    <span class="light zoom" title="Zoom"></span>
                </div>
            </div>
            <div class="toolbar-center">
                <div class="address-bar" role="search">
                    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <input type="search" class="url-input" placeholder="Search or enter website name" spellcheck="false" autocomplete="off">
                    <svg class="compass-icon" viewBox="0 0 512 512" width="20" height="20" aria-hidden="true">
                        <use href="/usr/share/icons/hicolor/scalable/apps/epiphany-mavericks.svg#compass"></use>
                    </svg>
                </div>
            </div>
            <div class="toolbar-right">
                <button class="toolbar-btn" title="Share" aria-label="Share">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.52.47 1.2.77 1.96.77 2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4c0 .15.01.3.04.44L8.15 9.65C6.52 7.85 4 6.53 4 4.97 4 3.17 5.17 2 7 2c1.43 0 2.75.57 3.76 1.51L17 1.05C14.77-.37 11.5 0 9 0 5.69 0 3 2.69 3 6c0 2.23 1.5 4.1 3.5 4.78L8.13 14.2C7.03 14.82 6 15.85 6 17c0 2.55 2.17 4.62 4.85 4.89v.01c.63 0 1.22-.1 1.79-.28v.72l3 3.14c.38.4.98.42 1.34.02.23-.27.35-.64.35-1.02V19c0-.55-.45-1-1-1H7c-.55 0-1 .45-1 1v2c0 .55.45 1 1 1h1.05c2.21 0 4.09-1.57 4.7-3.65l2.69 2.69c-.37.37-.58.89-.58 1.45 0 1.66 1.34 3 3 3s3-1.34 3-3c0-.56-.21-1.08-.58-1.45L17 19v-.72c.57.18 1.16.28 1.79.28v.01c2.68-.27 4.85-2.34 4.85-4.89 0-.19 0-.37-.01-.55l1.81-4.9z"/></svg>
                </button>
                <button class="toolbar-btn" title="Bookmarks" aria-label="Show Bookmarks">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                </button>
                <button class="toolbar-btn" title="Reading List" aria-label="Reading List">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- Favorites / Top Sites Grid -->
            <section class="top-sites-section">
                <h1 class="section-title">Top Sites</h1>
                <div class="sites-grid" id="sitesGrid">
                    <!-- Sites are populated by JavaScript -->
                </div>
                
                <div class="add-site" id="addSiteBtn" role="button" tabindex="0" aria-label="Add new top site">
                    <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <span>Add Site</span>
                </div>
            </section>

            <!-- Recommended / Frequently Visited -->
            <section class="recommended-section" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">Recommended</h2>
                    <button class="section-action" aria-label="Manage recommendations">Edit</button>
                </div>
                <div class="sites-grid" id="recommendedGrid"></div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-links">
                <a href="#" class="footer-link">Privacy Report</a>
                <a href="#" class="footer-link">Settings</a>
                <a href="#" class="footer-link">Help</a>
            </div>
            <div class="footer-info">
                Mavericks Web — Powered by WebKit
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
