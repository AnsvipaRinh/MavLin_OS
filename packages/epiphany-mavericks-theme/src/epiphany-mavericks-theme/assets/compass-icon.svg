<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Safari 7 Compass Icon - OS X 10.9 Style -->
  <defs>
    <!-- Glass effect gradient -->
    <radialGradient id="glassHighlight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Metal ring gradient -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e0"/>
      <stop offset="50%" stop-color="#d0d0c8"/>
      <stop offset="100%" stop-color="#b8b8b0"/>
    </linearGradient>
    
    <!-- Compass face gradient -->
    <radialGradient id="compassFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="70%" stop-color="#ebeae0"/>
      <stop offset="100%" stop-color="#d8d8d0"/>
    </radialGradient>
    
    <!-- Red needle gradient -->
    <linearGradient id="redNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5c5c"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    
    <!-- White needle gradient -->
    <linearGradient id="whiteNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Drop shadow for entire icon -->
  <g filter="url(#dropShadow)">
    <!-- Outer metal ring -->
    <circle cx="256" cy="256" r="240" fill="url(#metalRing)" stroke="#a0a098" stroke-width="2"/>
    
    <!-- Inner bevel highlight -->
    <circle cx="256" cy="256" r="235" fill="none" stroke="url(#glassHighlight)" stroke-width="3" opacity="0.6"/>
    
    <!-- Compass face background -->
    <circle cx="256" cy="256" r="220" fill="url(#compassFace)"/>
    
    <!-- Compass face inner shadow -->
    <circle cx="256" cy="256" r="218" fill="none" stroke="#c8c8c0" stroke-width="1"/>
    
    <!-- Degree markings (subtle) -->
    <g stroke="#999990" stroke-width="1" opacity="0.4">
      <!-- Major ticks (every 30 degrees) -->
      <line x1="256" y1="50" x2="256" y2="70" stroke-width="2"/>
      <line x1="256" y1="462" x2="256" y2="442" stroke-width="2"/>
      <line x1="50" y1="256" x2="70" y2="256" stroke-width="2"/>
      <line x1="462" y1="256" x2="442" y2="256" stroke-width="2"/>
      
      <!-- 45 degree ticks -->
      <line x1="118" y1="118" x2="138" y2="138" stroke-width="1.5"/>
      <line x1="394" y1="118" x2="374" y2="138" stroke-width="1.5"/>
      <line x1="118" y1="394" x2="138" y2="374" stroke-width="1.5"/>
      <line x1="394" y1="394" x2="374" y2="374" stroke-width="1.5"/>
      
      <!-- Minor ticks (every 15 degrees) - very subtle -->
      <g stroke-width="0.5" opacity="0.2">
        <line x1="256" y1="82" x2="256" y2="92"/>
        <line x1="256" y1="430" x2="256" y2="420"/>
        <line x1="82" y1="256" x2="92" y2="256"/>
        <line x1="430" y1="256" x2="420" y2="256"/>
        <line x1="152" y1="152" x2="167" y2="167"/>
        <line x1="360" y1="152" x2="345" y2="167"/>
        <line x1="152" y1="360" x2="167" y2="345"/>
        <line x1="360" y1="360" x2="345" y2="345"/>
      </g>
    </g>
    
    <!-- Cardinal directions (N, E, S, W) -->
    <g font-family="San Francisco, SF Pro Text, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#333333" text-anchor="middle" dominant-baseline="middle">
      <text x="256" y="78">N</text>
      <text x="442" y="262">E</text>
      <text x="256" y="448">S</text>
      <text x="70" y="262">W</text>
    </g>
    
    <!-- Intercardinal directions -->
    <g font-family="San Francisco, SF Pro Text, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="500" fill="#666660" text-anchor="middle" dominant-baseline="middle">
      <text x="162" y="162">NE</text>
      <text x="350" y="162">SE</text>
      <text x="350" y="362">SW</text>
      <text x="162" y="362">NW</text>
    </g>
    
    <!-- Compass needle pivot center -->
    <circle cx="256" cy="256" r="12" fill="#c0c0b8" stroke="#a0a098" stroke-width="1"/>
    <circle cx="256" cy="256" r="8" fill="#e8e8e0" stroke="#d0d0c8" stroke-width="0.5"/>
    <circle cx="256" cy="256" r="4" fill="#a0a098"/>
    
    <!-- Red needle (North) -->
    <g transform="rotate(0 256 256)">
      <!-- Needle shadow -->
      <path d="M 256 50 L 252 100 L 256 104 L 260 100 Z" fill="url(#redNeedle)" filter="url(#dropShadow)" opacity="0.3" transform="translate(2, 2)"/>
      <!-- Red needle body -->
      <path d="M 256 50 L 252 100 L 256 104 L 260 100 Z" fill="url(#redNeedle)"/>
      <!-- Needle highlight -->
      <path d="M 256 50 L 254 100 L 256 102" fill="rgba(255,255,255,0.3)"/>
    </g>
    
    <!-- White needle (South) -->
    <g transform="rotate(180 256 256)">
      <path d="M 256 50 L 252 100 L 256 104 L 260 100 Z" fill="url(#whiteNeedle)" filter="url(#dropShadow)" opacity="0.3" transform="translate(2, 2)"/>
      <path d="M 256 50 L 252 100 L 256 104 L 260 100 Z" fill="url(#whiteNeedle)"/>
      <path d="M 256 50 L 254 100 L 256 102" fill="rgba(255,255,255,0.3)"/>
    </g>
    
    <!-- East/West needle indicators (small triangles) -->
    <g transform="rotate(90 256 256)">
      <path d="M 256 120 L 252 150 L 256 154 L 260 150 Z" fill="#999990" opacity="0.6"/>
    </g>
    <g transform="rotate(270 256 256)">
      <path d="M 256 120 L 252 150 L 256 154 L 260 150 Z" fill="#999990" opacity="0.6"/>
    </g>
    
    <!-- Center jewel/reflection -->
    <circle cx="256" cy="256" r="6" fill="url(#glassHighlight)"/>
    <circle cx="256" cy="256" r="4" fill="#ffffff" opacity="0.2"/>
  </g>
  
  <!-- Outer glass reflection overlay -->
  <ellipse cx="256" cy="180" rx="180" ry="60" fill="url(#glassHighlight)" opacity="0.15"/>
</svg>