# PROFILE: generic — baseline for any x86-64 hardware
# No MacBook-specific workarounds. Kernel defaults apply.
# CMDLINE: base only (no fragments)
CMDLINE="quiet loglevel=3"
# Turbo: ON (kernel/HWP default)
# APST: kernel default
# FBC: auto. GuC/HuC: driver default. THP: madvise. VM: defaults.
# zram: ram/2 zstd (structural, always on)
# TLP: kernel/TLP defaults (no powersave governor override)
# Sysctl: NONE (kernel defaults)
# Services: TLP + zram + NetworkManager; NO thermald/ananicy