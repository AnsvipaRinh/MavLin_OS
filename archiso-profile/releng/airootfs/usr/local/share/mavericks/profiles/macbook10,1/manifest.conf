# PROFILE: macbook10,1 — Apple MacBook10,1 (A1534, Mid 2017) specific overrides
# All entries here are ISOLATED or ENTANGLED per PROFILE_COUPLING.md
# Base CMDLINE from generic + MacBook fragments
# Generic profile baseline: "quiet loglevel=3"
# MacBook fragments (graceful-missing: install only on MacBook10,1 path):
#   fragments/99-mavericks-s3x.conf      → pcie_port_pm=off (Apple S3X NVMe resume workaround)
#   fragments/99-mavericks-display.conf  → i915.enable_psr=0 (Gen9.5 panel flicker prevention)
# Composed CMDLINE on MacBook10,1: "quiet loglevel=3 pcie_port_pm=off i915.enable_psr=0"
CMDLINE_BASE="quiet loglevel=3"
CMDLINE_FRAGMENTS="fragments/99-mavericks-s3x.conf fragments/99-mavericks-display.conf"

# Network: BCM43602 FullMAC → pin wpa_supplicant backend (99-mavericks-wifi-backend.conf)
# Connectivity check disabled (inherited from generic 99-mavericks-network.conf)
NETWORK_FRAGMENTS="99-mavericks-wifi-backend.conf"

# Power: MacBook10,1 fanless Core M TLP tuning (99-mavericks-power.conf)
POWER_FRAGMENTS="99-mavericks-power.conf"

# SPI/applespi: keyboard/trackpad modules (99-mavericks-spi.conf)
# Installed ONLY when SPI strategy 1/2/3 selected (not Strategy 4 = external USB-C input)
SPI_FRAGMENTS="99-mavericks-spi.conf"

# Audio: CS4208 softvol WirePlumber rule (51-macbook-cs4208-softvol.conf)
# Installed ONLY when macbook12-audio-driver package is present (runtime detection)
AUDIO_FRAGMENTS="51-macbook-cs4208-softvol.conf"

# NVRAM: brcmfmac EFI NVRAM provisioning script (extract-brcmfmac-nvram.sh)
# Runs at firstboot; no-op if EFI NVRAM already present
NVRAM_SCRIPT="extract-brcmfmac-nvram.sh"

# zram: same as generic (structural, always on)
ZRAM_CONFIG="99-mavericks-zram.conf"

# Bootloader: baseline entries + kernel-swap entries for SPI strategies 2/3
# (linux-macbook / linux-lts-applespi) — generated by apply-hardware-selection.sh