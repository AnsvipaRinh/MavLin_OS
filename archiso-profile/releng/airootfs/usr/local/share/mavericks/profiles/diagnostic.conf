# PROFILE: diagnostic — maximum logging, no power saving that hides bugs
CMDLINE="loglevel=7 udev.log_priority=debug systemd.log_level=debug pcie_port_pm=off i915.enable_psr=0 drm.debug=0x1e log_buf_len=8M earlyprintk=efi"
# TLP: STOP tlp.service before diagnostic runs (isolates kernel behavior)
# Use with: tools/diagnostics/mv-collect.sh
