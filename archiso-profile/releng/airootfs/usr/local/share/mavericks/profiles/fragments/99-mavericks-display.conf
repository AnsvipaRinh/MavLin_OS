# MavLinOS — i915 Panel Self-Refresh disable (MacBook10,1, Gen9.5)
# Phase 0.3 baseline: i915.enable_psr=0 is a diagnostic-safe default.
# Gen9/9.5 panels exhibited flicker with PSR enabled (LP#2086587/2062951).
# Upstream fix landed in 6.8.0-53 but panel-specific behavior varies.
# This fragment is installed ONLY on MacBook10,1 hardware path.
# On generic hardware, this file is absent → kernel default (PSR auto/enabled).
# Graceful-missing semantics: kernel cmdline fragments concatenated;
# absent fragment = no override, kernel default applies.
#
# Validation: E4/E5 experiments test PSR1/PSR2 enable
# (configs/profiles/experiments/E4-psr1.cmdline, E5-psr2.cmdline).
# If PSR works without flicker on target hardware, REMOVE this fragment.

i915.enable_psr=0
