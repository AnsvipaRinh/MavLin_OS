# PROFILE: baseline — Phase 0.3 FIRST-BOOT BASELINE (source of truth)
# Identical to bootstrap; this file is the canonical definition.
# Any doc claiming a different baseline is wrong — fix the doc, not this file.
# CMDLINE composed from: base (quiet loglevel=3) + fragments/
# MacBook-specific fragments (installed on MacBook10,1 path only):
#   fragments/99-mavericks-s3x.conf      → pcie_port_pm=off
#   fragments/99-mavericks-display.conf  → i915.enable_psr=0
# On generic hardware, fragments are absent → kernel defaults apply.
CMDLINE="quiet loglevel=3 pcie_port_pm=off i915.enable_psr=0"
# Turbo: ON (kernel/HWP default). Test OFF as E1.
# APST: kernel default (25000). Test OFF as E3.
# FBC: auto. GuC/HuC: driver default. THP: madvise. VM: defaults. zram: ram/2 zstd.
# TLP: governor=powersave, ASPM=powersave, USB_AUTOSUSPEND=1, RUNTIME_PM=auto
# Sysctl: NONE (file intentionally absent)