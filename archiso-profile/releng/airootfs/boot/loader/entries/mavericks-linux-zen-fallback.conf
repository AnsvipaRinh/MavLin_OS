title   Mavericks Linux (linux-zen fallback)
linux   /vmlinuz-linux-zen
initrd  /intel-ucode.img
initrd  /initramfs-linux-zen-fallback.img
options root=PARTUUID=%ROOT_PARTUUID% rw rootflags=subvol=@ quiet loglevel=3 intel_idle.max_cstate=4 i915.enable_guc=3 i915.enable_fbc=1 i915.enable_psr=2 nvme.noacpi=1 acpi_backlight=vendor applespi.debug=0