# 99-mavericks.conf — Phase 0.3 minimal TLP baseline
# Only explicitly chosen conservative settings. Everything else = TLP/kernel default.
# CPU_BOOST / CPU_HWP_DYN_BOOST / CPU_ENERGY_PERF_POLICY / PLATFORM_PROFILE intentionally unset.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
PCIE_ASPM_ON_AC=powersave
PCIE_ASPM_ON_BAT=powersave
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
USB_AUTOSUSPEND=1
