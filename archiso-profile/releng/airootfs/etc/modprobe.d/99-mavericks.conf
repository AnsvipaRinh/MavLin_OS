# Broadcom BCM43602 Wi-Fi (MacBook10,1) - use broadcom-wl-dkms
blacklist brcmfmac
blacklist brcmsmac
blacklist b43
blacklist b43legacy
blacklist ssb
blacklist bcma

# applespi - keyboard/trackpad (may need workarounds on 6.15+)
options applespi debug=0

# i915 - Intel GPU power management
options i915 enable_guc=3 enable_fbc=1 enable_psr=2

# nvme - power management
options nvme_core default_ps_max_latency_us=0