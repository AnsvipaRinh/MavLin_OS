# MavLinOS — applespi / SPI controller modules (MacBook10,1)
# Phase 0.3: these modules enable the built-in keyboard/trackpad via applespi.
# This fragment is installed ONLY on MacBook10,1 hardware path (Strategy 1/2/3).
# On generic hardware, this file is absent → no SPI modules in initramfs.
# Graceful-missing semantics: mkinitcpio reads all *.conf in conf.d;
# absent fragment = no MacBook SPI modules, initramfs stays generic.
#
# Strategies (apply-hardware-selection.sh):
#   1) macbook12-spi-driver-dkms → adds macbook12_spi module
#   2) linux-macbook kernel       → uses in-kernel applespi
#   3) linux-lts + backports      → uses in-kernel applespi
#   4) Skip (external USB-C input) → this fragment NOT installed

MODULES=(applespi spi_pxa2xx_platform intel_lpss_pci intel_lpss_acpi)