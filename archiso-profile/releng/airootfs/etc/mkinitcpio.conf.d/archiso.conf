# MavLinOS — archiso build hooks (generic)
# MacBook10,1 SPI/applespi modules are NOT included in the live ISO initramfs.
# They are added post-install via /etc/mkinitcpio.conf.d/99-mavericks-spi.conf
# by apply-hardware-selection.sh on the MacBook hardware path.

HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)