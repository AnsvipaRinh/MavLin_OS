# Mavericks Linux — generic mkinitcpio.conf (no MacBook-specific modules)
# MacBook10,1 SPI/applespi modules are in /etc/mkinitcpio.conf.d/99-mavericks-spi.conf
# (installed only on MacBook10,1 hardware path via apply-hardware-selection.sh).
# On generic hardware, that fragment is absent → clean generic initramfs.

MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap block filesystems fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-c -T0 --long -19)