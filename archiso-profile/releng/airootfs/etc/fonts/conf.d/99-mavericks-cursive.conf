<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- MavLinOS: map the generic 'cursive' family to Z003 (URW
     chancery face from gsfonts), the free handwriting-style font used by
     Stickies and other paper-textured apps. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>cursive</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Z003</string>
    </edit>
  </match>
</fontconfig>
