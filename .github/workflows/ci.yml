name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Acquire::Retries=3 \
            shellcheck desktop-file-utils python3 libxml2-utils \
            python3-gi python3-cairo python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-poppler-0.18 \
            gir1.2-gtksource-4 gir1.2-secret-1 xvfb

      - name: Bash syntax (bash -n)
        run: |
          find . -type f -name '*.sh' ! -path './.git/*' -exec bash -n {} \;

      - name: Python syntax (py_compile)
        run: |
          find . -type f -name '*.py' ! -path './.git/*' -exec python3 -m py_compile {} \;

      - name: XML validation (xmllint)
        run: |
          find . -type f -name '*.xml' ! -path './.git/*' -exec xmllint --noout {} \;

      - name: Desktop file validation
        run: |
          find . -type f -name '*.desktop' ! -path './.git/*' -exec desktop-file-validate {} \;

      - name: PKGBUILD parse check
        run: |
          for d in packages/*/; do
            [ -f "$d/PKGBUILD" ] && bash -n "$d/PKGBUILD" && echo "OK: $d"
          done

      - name: Profile sync check
        run: bash scripts/check-profile-sync.sh

      - name: Panel configuration validation
        run: python3 scripts/test-panel-config.py

      - name: Full sync check
        run: bash scripts/check-sync.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (if available) or regex fallback
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --no-git --verbose
          else
            echo "gitleaks not installed; running lightweight regex scan"
            patterns=(
              "AKIA[0-9A-Z]{16}"
              "gh[pousr]_[A-Za-z0-9]{36,}"
              "ghu_[A-Za-z0-9]{36,}"
              "github_pat_[A-Za-z0-9]{22,}"
              "glpat-[A-Za-z0-9]{20,}"
              "xox[baprs]-[0-9a-zA-Z-]{10,}"
              "sk_live_[0-9a-zA-Z]{24,}"
              "rk_live_[0-9a-zA-Z]{24,}"
              "sk_test_[0-9a-zA-Z]{24,}"
              "rk_test_[0-9a-zA-Z]{24,}"
              "AIza[0-9A-Za-z\\-_]{35}"
              "ya29\\.[0-9A-Za-z\\-_]+"
              "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
              "password\\s*[=:]\\s*['\"][^'\"]{8,}['\"]"
              "secret\\s*[=:]\\s*['\"][^'\"]{8,}['\"]"
              "api[_-]?key\\s*[=:]\\s*['\"][^'\"]{16,}['\"]"
            )
            found=0
            for pat in "${patterns[@]}"; do
              if grep -rEi "$pat" --exclude-dir=.git . 2>/dev/null | grep -v "patterns=(" | grep -v "found=0" | grep -v "echo"; then
                found=1
              fi
            done
            if [ $found -eq 1 ]; then
              echo "::warning::Potential secrets found (regex fallback). Install gitleaks for full scan."
              exit 1
            fi
            echo "No obvious secrets found via regex fallback."
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MV_GUI_ISOLATED: "1"
      MV_FORBIDDEN_DISPLAYS: ":0,wayland-0"
      MV_GUARD_LOG: /tmp/mv-gui-guard-ci.log
      PYTHONPATH: scripts/gui-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Acquire::Retries=3 \
            python3 python3-pip sassc python3-cairo python3-gi-cairo \
            gir1.2-gtk-3.0
          pip3 install --quiet pytest

      - name: Run mv-* unit tests
        run: |
          : > "$MV_GUARD_LOG"
          find . -type f -name 'test-mv-*.py' ! -path './.git/*' -exec python3 -m pytest {} -v \;

      - name: Host-display guard gate
        run: |
          if grep -q HOST-DISPLAY-BLOCKED "$MV_GUARD_LOG" 2>/dev/null; then
            echo "::error::host display attempt blocked by scripts/gui-guard"
            cat "$MV_GUARD_LOG"
            exit 1
          fi
          echo "OK: host-display guard: 0 attempts (headless runner, GUI smokes skipped)"

      - name: Theme validation
        run: |
          python3 scripts/test-theme-css.py

      - name: Finder launcher regression gate
        run: |
          python3 scripts/test-finder-launcher.py

      - name: Dock default launchers gate
        run: |
          python3 scripts/test-dock-launchers.py

      - name: Window Super-key contract
        run: |
          python3 scripts/test-window-keys.py

      - name: Brightness key contract
        run: |
          python3 scripts/test-brightness-keys.py

      - name: Backlight udev contract
        run: |
          python3 scripts/test-backlight-udev.py

      - name: Desktop icons contract
        run: |
          python3 scripts/test-desktop-icons.py

      - name: Bookmarks seed contract
        run: |
          python3 scripts/test-bookmarks-seed.py

      - name: Terminal key + Dock pin contract
        run: |
          python3 scripts/test-terminal-key.py

      - name: Panel clock contract
        run: |
          python3 scripts/test-panel-clock.py

      - name: Apple menu packaging contract
        run: |
          python3 scripts/test-apple-menu-packaging.py

      - name: App menu Python module contract
        run: |
          python3 scripts/test-appmenu-module.py

      - name: Lock screen contract
        run: |
          python3 scripts/test-lock-screen.py

      - name: Window chrome contract
        run: |
          python3 scripts/test-window-chrome.py

      - name: Notifyd config contract
        run: |
          python3 scripts/test-notifyd-config.py

      - name: Workspaces contract
        run: |
          python3 scripts/test-workspaces.py

      - name: Alt+Tab cycle contract
        run: |
          python3 scripts/test-alt-tab.py

      - name: Wallpaper paths contract
        run: |
          python3 scripts/test-wallpaper-paths.py

      - name: Empty Trash keys contract
        run: |
          python3 scripts/test-empty-trash-keys.py

      - name: Trash + Eject keys contract
        run: |
          python3 scripts/test-trash-eject-keys.py

  profile-sync:
    name: Profile Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check profile sync
        run: bash scripts/check-profile-sync.sh

  contribution-format:
    name: Contribution Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR body sections
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          required_sections=(
            "Summary"
            "Mavericks-ref"
            "Visual"
            "Interaction"
            "Backend"
            "Integration"
            "Performance"
            "Security"
            "Tests"
            "Hardware-scope"
            "AI-disclosure"
            "Limitations"
          )
          missing=()
          for section in "${required_sections[@]}"; do
            if ! echo "$PR_BODY" | grep -qi "^### $section"; then
              missing+=("$section")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::PR body missing required sections:"
            for m in "${missing[@]}"; do
              echo "  - $m"
            done
            exit 1
          fi
          echo "All required sections present."

  hardware-tests:
    name: Hardware Tests (skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: false
    steps:
      - name: Skip - requires MacBook10,1 hardware
        run: echo "Hardware tests skipped - no Mac hardware in CI"
